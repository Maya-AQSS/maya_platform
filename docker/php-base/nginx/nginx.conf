# maya/php-base — nginx delante de php-fpm (rol api).
# Corre como www-data sin root y con el sistema de ficheros de solo lectura:
# todo lo que escribe va a /tmp/nginx (emptyDir en k8s).

pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    log_format maya '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout maya;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 25m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root  /var/www/html/public;
        index index.php;
        charset utf-8;

        # Liveness barata: responde nginx sin tocar PHP.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass  php-fpm;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO       $fastcgi_path_info;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
