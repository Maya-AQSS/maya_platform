; maya/php-base — ajustes de producción comunes.
; Las apps pueden añadir un fichero 90-app.ini con sus límites propios
; (memory_limit, upload_max_filesize...) sin tocar este.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

date.timezone = UTC
memory_limit = 256M
post_max_size = 20M
upload_max_filesize = 20M
max_execution_time = 60

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: el código no cambia en runtime (imagen inmutable).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit_buffer_size = 64M
opcache.jit = 1255
