; maya/php-base — php-fpm (un solo pool). El proceso corre ya como www-data,
; por eso no hay directivas user/group. Solo escucha en loopback: nginx vive
; en el mismo contenedor.

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Salud del pool sin pasar por Laravel (uso interno, no expuesto por nginx).
pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
access.log = /dev/null
