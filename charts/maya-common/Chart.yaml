apiVersion: v2
name: maya-common
description: |
  Library chart compartido por las apps Laravel + React de Maya. Despliega la
  topología estándar sobre las 4 imágenes de cada app (api, worker, reverb,
  frontend): Deployments, Services, Ingress (Traefik), ConfigMaps, Job de
  migración, PVC opcional, PodDisruptionBudget, NetworkPolicy y ServiceAccount,
  con secretos inyectados por Vault Agent (o un Secret externo).

  Cada app declara este chart en `dependencies:` y renderiza todo con
  `{{ include "maya-common.all" . }}` desde un único template; su values.yaml es
  el único fichero propio. El contrato de values está documentado en values.yaml
  y en README.md.
type: library
version: 0.2.0
appVersion: "0.22.0"
icon: https://ceedcv.es/favicon.ico
maintainers:
  - name: CEEDCV — equipo Maya
sources:
  - https://github.com/Maya-AQSS/maya_platform
kubeVersion: ">=1.27.0-0"
keywords:
  - maya
  - laravel
  - react
  - library
  - traefik
  - keycloak
  - vault
