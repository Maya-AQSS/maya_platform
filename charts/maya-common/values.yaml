# maya-common — contrato de values.
#
# Es un library chart: Helm nunca renderiza estos valores directamente. Son los
# valores por defecto que cada app puede sobreescribir en su deploy/helm/values.yaml.
# Todo lo que no se indica aquí NO existe en el chart.
#
# Imágenes (F3): una app son 4 imágenes con el mismo tag:
#   <registry>/<repository>-api      nginx + php-fpm      → Deployment api
#   <registry>/<repository>-worker   consumidor / colas   → Deployments worker y scheduler, Job migrate
#   <registry>/<repository>-reverb   WebSocket            → Deployment reverb
#   <registry>/<repository>-frontend SPA en nginx         → Deployment frontend
# El entrypoint de las imágenes backend elige el proceso por el primer argumento
# (args: ["migrate"], ["scheduler"], ["artisan", "db:seed", ...]); ver
# maya_platform/docker/README.md.

nameOverride: ""
fullnameOverride: ""

commonLabels:
  app.kubernetes.io/part-of: maya

image:
  registry: 10.224.237.240:5000
  # Prefijo de las 4 imágenes: <repository>-api, -worker, -reverb, -frontend.
  repository: maya/maya-app
  # Obligatorio. Misma versión semver que el chart (lo fija helmfile / CI).
  # Un componente puede usar otro tag con <componente>.imageTag (api, worker,
  # reverb, frontend); p. ej. frontend.imageTag: 1.2.0-dev en desarrollo.
  tag: ""
  pullPolicy: IfNotPresent
  # Creado fuera del chart: kubectl -n <ns> create secret docker-registry regcred ...
  pullSecrets: []

# ─── ServiceAccount dedicada ──────────────────────────────────────────────────
# El Vault Agent se autentica con el token de la SA del pod: hay que montarlo.
serviceAccount:
  create: true
  name: ""                         # vacío = nombre completo de la release
  automountServiceAccountToken: true
  annotations: {}

# ─── Secretos: Vault Agent Injector (por defecto) o Secret externo ────────────
vault:
  enabled: true
  namespace: vault-system          # para la NetworkPolicy (egress al puerto 8200)
  role: ""                         # vacío = nombre completo de la release (un rol por app)
  secretPath: ""                   # vacío = secret/data/<nombre completo>
  # Claves que el agente exporta en /vault/secrets/config; el entrypoint las carga.
  keys: []
  agentResources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Con vault.enabled=false los secretos llegan por envFrom desde este Secret.
secret:
  externalName: ""                 # Secret creado fuera del chart (recomendado)
  data: {}                         # solo para pruebas; nunca credenciales reales en git

# ─── Configuración no sensible (ConfigMap → envFrom en todos los backends) ───
# Claves en MAYÚSCULAS como en .env. APP_ENV, APP_DEBUG y SESSION_SECURE_COOKIE
# se fuerzan siempre a producción.
config:
  # Proxies de confianza (shared-http-laravel): quien entrega la petición al pod es
  # Traefik, así que es el pod CIDR del clúster. Producción usa el de K3s por defecto;
  # el K3s de desarrollo (VM 201) lo sobreescribe con 10.43.0.0/16 (IaC/dev/values).
  # Sin esta clave, con APP_ENV=production y shared-http-laravel >= 0.21, las apps que
  # confían en proxies (dms, audit, logs y las nuevas) no arrancan.
  TRUSTED_PROXIES: "10.42.0.0/16"

# ─── api: nginx + php-fpm ─────────────────────────────────────────────────────
api:
  enabled: true
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  # /healthz lo responde nginx sin PHP (vivo); ready pasa por Laravel (BD, Redis...).
  startupProbe:
    httpGet: { path: /api/v1/health/live, port: http }
    periodSeconds: 5
    failureThreshold: 24            # hasta 2 min para calentar cachés
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet: { path: /api/v1/health/ready, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: api
  pdb:
    enabled: true
    minAvailable: 1

# ─── frontend: SPA en nginx sin privilegios (maya/web-base) ───────────────────
frontend:
  enabled: true
  replicas: 2
  port: 8080
  # Variables MAYA_PUBLIC_* (→ /config.js) y MAYA_CSP; van a un ConfigMap propio.
  env: {}
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 15
    timeoutSeconds: 3
  readinessProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 10
    timeoutSeconds: 3
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: frontend
  pdb:
    enabled: true
    minAvailable: 1
  # nginx-unprivileged corre como uid 101.
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

# ─── worker: consumidor AMQP o cola Laravel (imagen *-worker) ─────────────────
worker:
  enabled: true
  replicas: 1                      # singleton salvo que el consumidor lo permita
  # [] = comando grabado en la imagen (MAYA_WORKER_CMD). Para otro: ["queue:work", "--queue=alta"].
  args: []
  extraEnv: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # pgrep se ejecuta sin shell: no se encuentra a sí mismo.
  livenessProbe:
    exec:
      command: ["pgrep", "-f", "php artisan"]
    initialDelaySeconds: 30
    periodSeconds: 30
  terminationGracePeriodSeconds: 120   # que termine el job en curso
  nodeSelector: {}
  tolerations: []

# ─── scheduler: `schedule:work` (imagen *-worker) ─────────────────────────────
scheduler:
  enabled: false
  extraEnv: []
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 300m, memory: 192Mi }
  livenessProbe:
    exec:
      command: ["pgrep", "-f", "php artisan"]
    initialDelaySeconds: 30
    periodSeconds: 30

# ─── reverb: WebSocket (imagen *-reverb) ──────────────────────────────────────
reverb:
  enabled: true
  replicas: 1                      # escalar requiere REVERB_SCALING_ENABLED + Redis
  port: 8080
  extraEnv: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  livenessProbe:
    tcpSocket: { port: ws }
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    tcpSocket: { port: ws }
    initialDelaySeconds: 10
    periodSeconds: 10
  terminationGracePeriodSeconds: 60

# ─── migrate: Job hook post-install/pre-upgrade (imagen *-worker) ─────────────
# post-install: la ServiceAccount y el PVC ya existen en la primera instalación.
# Recibe la configuración inline (no depende del ConfigMap). Solo hacia delante:
# helm rollback no revierte el esquema.
migrate:
  enabled: true
  args: ["migrate"]
  backoffLimit: 1
  activeDeadlineSeconds: 900
  hookWeight: "-5"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ─── storage: PVC RWX para ficheros de la app (dms) ───────────────────────────
storage:
  enabled: false
  existingClaim: ""                # usar un PVC ya creado
  storageClassName: maya-nfs
  accessMode: ReadWriteMany
  size: 20Gi
  mountPath: /var/www/html/storage/app/media
  subPath: ""                      # aísla la app dentro del export NFS

# ─── ingress: Traefik + cert-manager (CA interna) ─────────────────────────────
# Dos hosts por app: `host` → frontend; `apiHost` → api, y `apiHost` + reverbPath → reverb.
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: maya-internal-ca
  host: ""
  apiHost: ""
  reverbPath: /app
  tls:
    enabled: true
    frontendSecretName: ""         # vacío = <nombre completo>-frontend-tls
    apiSecretName: ""              # vacío = <nombre completo>-api-tls

# ─── networkPolicy: deny-all + lo estrictamente necesario ─────────────────────
networkPolicy:
  enabled: true
  traefik:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
  # Namespaces de otras apps Maya que pueden llamar a la api (este-oeste).
  allowedNamespaces: []
  egress:
    dns: true
    # Destinos externos: [{ cidr: 10.224.237.252/32, ports: [5432] }]
    cidrs: []
    # Namespaces del clúster: [{ name: maya-infra, ports: [6379] }]
    namespaces: []
    # Salida a Internet (80/443) excluyendo redes privadas. Solo si la app lo necesita.
    internet: false

# ─── Seguridad de pods (backends: uid 82 de maya/php-base) ────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 82
  runAsGroup: 82
  fsGroup: 82
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5
